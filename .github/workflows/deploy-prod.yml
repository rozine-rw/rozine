name: Deploy (production)

# Deploys to the Contabo production app (rozine.rw) from main.
#
# Deployment is gated: the `admission` job must grant D-68 admission for the
# exact candidate SHA before `deploy` may touch the server. This applies to
# manual dispatch too — there is no ungated path to the environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  admission:
    uses: ./.github/workflows/deployment-admission.yml
    with:
      target_branch: main
      environment: production

  deploy:
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the admitted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync source to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude '.env' \
            --exclude 'storage' \
            --exclude 'bootstrap/cache' \
            --exclude 'public/build' \
            --exclude 'public/storage' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/var/www/rozine-prod/"

      - name: Build, migrate & reload on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            'bash -s -- /var/www/rozine-prod' < .github/scripts/deploy-remote.sh
