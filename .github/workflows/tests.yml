name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Restore PHP-specific TIA state
        id: tia-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pest/tia
          key: pest-tia-${{ runner.os }}-${{ runner.arch }}-php-8.4-${{ hashFiles('composer.lock', 'package-lock.json', 'phpunit.xml') }}-${{ github.sha }}
          restore-keys: |
            pest-tia-${{ runner.os }}-${{ runner.arch }}-php-8.4-${{ hashFiles('composer.lock', 'package-lock.json', 'phpunit.xml') }}-
            pest-tia-${{ runner.os }}-${{ runner.arch }}-php-8.4-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run non-test engineering checks
        run: composer ci:check:static

      - name: Build production assets
        run: npm run build

      # A graph restored by fallback key was recorded against a different tree,
      # so the lines it remembers no longer map onto this one and any test it
      # replays reports as uncovered. Only an exact hit is safe to reuse.
      - name: Enforce complete PHP line coverage with TIA
        run: ./vendor/bin/pest --coverage --min=100 --compact --tia ${{ steps.tia-cache.outputs.cache-hit == 'true' && '' || '--fresh' }}

      - name: Save PHP-specific TIA state
        if: steps.tia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pest/tia
          key: ${{ steps.tia-cache.outputs.cache-primary-key }}
