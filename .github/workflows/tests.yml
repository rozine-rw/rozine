name: tests

on:
  push:
    branches:
      - dev
      - uat
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: PHP ${{ matrix.php-version }} quality gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        env:
          DB_PASSWORD: rozine
        run: php artisan migrate --force

      - name: Build production assets
        run: npm run build

      - name: Run authoritative static and PHP test gates
        run: composer ci:check:php

      - name: Confirm the baseline inventory still describes the code
        env:
          DB_PASSWORD: rozine
        run: php artisan inventory:baseline --check

      - name: Record PHP evidence identity
        if: always()
        run: |
          mkdir -p coverage/php
          git rev-parse HEAD > coverage/php/tested-sha.txt
          php --version | head -n 1 > coverage/php/runtime.txt

      - name: Upload PHP coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-coverage-${{ matrix.php-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/php
          if-no-files-found: warn
          retention-days: 30

  web:
    name: TypeScript/React quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP for Wayfinder generation
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies for Wayfinder generation
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare Laravel for Wayfinder generation
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Resolve immutable coverage comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_TARGET_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            target_sha="$PR_TARGET_SHA"
          else
            target_sha="$PUSH_TARGET_SHA"
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Head SHA is not a full immutable Git SHA." >&2
            exit 1
          fi

          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$target_sha" =~ ^0+$ ]]; then
            echo "Target SHA is unavailable; changed-branch coverage fails closed." >&2
            exit 1
          fi

          base_sha="$(git merge-base "$target_sha" "$HEAD_SHA")"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          echo "CLIENT_COVERAGE_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "CLIENT_COVERAGE_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "CLIENT_COVERAGE_TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: Run authoritative TypeScript and React gates
        run: npm run ci:web

      - name: Upload client coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/web
            .coverage-provenance/client.json
            config/client-source-manifest.json
            config/client-risk-manifest.json
          if-no-files-found: warn
          retention-days: 30

  concurrency:
    name: PostgreSQL concurrency lane
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # D-73 makes 8.5 the canonical runtime; the race evidence is recorded
          # on the version that is actually deployed.
          php-version: '8.5'
          tools: composer:v2
          # pcntl forks the parallel writers; without it the race test cannot
          # run at all, and a silently skipped race test is not evidence.
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # This lane runs the whole suite, so it renders Blade and needs the Vite
      # manifest. public/build is no longer tracked, so it has to be built here
      # exactly as the PHP quality gate builds it.
      - name: Build production assets
        run: npm run build

      - name: Run the suite and the concurrency evidence against PostgreSQL
        run: composer test:php:pgsql

      - name: Record PostgreSQL evidence identity
        if: always()
        env:
          PGHOST: 127.0.0.1
          PGUSER: rozine_test
          PGPASSWORD: rozine_test
          PGDATABASE: rozine_test
        run: |
          mkdir -p coverage/pgsql
          git rev-parse HEAD > coverage/pgsql/tested-sha.txt
          php --version | head -n 1 > coverage/pgsql/runtime.txt
          psql -X -tAc 'select version();' \
            > coverage/pgsql/database.txt

      - name: Upload PostgreSQL concurrency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgsql-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/pgsql
          if-no-files-found: warn
          retention-days: 30

  negative-controls:
    name: PHP gate negative controls
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          # The coverage control needs a driver; without one it skips, and a
          # skipped control is not evidence that the coverage gate can go red.
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: xdebug

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Prove each PHP gate rejects the violation it exists to catch
        run: bash scripts/quality/verify-negative-controls.sh

      - name: Confirm no planted violation survived the run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the negative-control run left the tree dirty"
            git status --porcelain
            exit 1
          fi

  admission:
    name: Deployment admission negative controls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove the D-68 gate refuses every unevidenced candidate
        run: bash .github/scripts/test-deployment-admission.sh
