name: tests

on:
  push:
    branches:
      - dev
      - uat
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Auto uses POC for dev/UAT; full is exhaustive release validation
        required: true
        default: auto
        type: choice
        options: [auto, poc, full]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  board-sync:
    name: Board sync offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed merge or pushed commit without App credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Simulate board events and API failures without network or secrets
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_project_board_*.py' -v
      - name: Validate workflow syntax with a verified actionlint release
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

  plan:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      source_run: ${{ steps.scope.outputs.source_run }}
      poc: ${{ steps.scope.outputs.poc }}
      scope: ${{ steps.scope.outputs.scope }}
      reused: ${{ steps.scope.outputs.reused }}
    steps:
      - name: Checkout proposed merge or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Reuse only original successful evidence for an identical dev/UAT tree
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          VALIDATION: ${{ inputs.validation }}
        run: python3 .github/scripts/select-validation-scope.py

  php-shards:
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    name: PHP 8.5 tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Cache Composer downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        env:
          DB_PASSWORD: rozine
        run: php artisan migrate --force

      - name: Build production assets
        run: npm run build

      - name: Run complete non-TIA test shard with coverage
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/quality/run-php-shard.sh "$SHARD"

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/php/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  ci:
    needs: [plan, php-shards]
    if: ${{ always() && needs.plan.outputs.full == 'true' }}
    name: PHP ${{ matrix.php-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'

    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.php-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "::error::PHP shards did not all succeed ($SHARD_RESULT)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Cache Composer downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        env:
          DB_PASSWORD: rozine
        run: php artisan migrate --force

      - name: Build production assets
        run: npm run build

      - name: Run authoritative PHP static gates
        run: composer ci:check:php:static

      - name: Enumerate the complete non-TIA test catalog
        env:
          PHP_SHARD_CATALOG: coverage/php/expected-tests.json
        run: |
          mkdir -p coverage/php
          php vendor/bin/pest --bootstrap=scripts/quality/php-shard-bootstrap.php --ci --no-tia --list-tests > /dev/null

      - name: Download this run's four shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: php-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/shards

      - name: Collect shard directories
        run: |
          for shard in 1 2 3 4; do
            mv "coverage/shards/php-shard-$shard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "coverage/php/shard-$shard"
          done

      - name: Require complete test execution and 100% combined coverage
        env:
          SHARD_RESULT: ${{ needs.php-shards.result }}
        run: php scripts/quality/php-shard-evidence.php merge "$PWD" coverage/php coverage/php/expected-tests.json "$SHARD_RESULT"

      - name: Confirm the baseline inventory still describes the code
        env:
          DB_PASSWORD: rozine
        run: php artisan inventory:baseline --check

      - name: Upload PHP coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-coverage-${{ matrix.php-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/php
          if-no-files-found: error
          retention-days: 30

  web:
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    name: TypeScript/React quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup PHP for Wayfinder generation
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies for Wayfinder generation
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare Laravel for Wayfinder generation
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Resolve immutable coverage comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_TARGET_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            target_sha="$PR_TARGET_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target_sha="$(git rev-parse HEAD^)"
          else
            target_sha="$PUSH_TARGET_SHA"
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Head SHA is not a full immutable Git SHA." >&2
            exit 1
          fi

          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$target_sha" =~ ^0+$ ]]; then
            echo "Target SHA is unavailable; changed-branch coverage fails closed." >&2
            exit 1
          fi

          base_sha="$(git merge-base "$target_sha" "$HEAD_SHA")"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          echo "CLIENT_COVERAGE_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "CLIENT_COVERAGE_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "CLIENT_COVERAGE_TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: Run authoritative TypeScript and React gates
        run: npm run ci:web

      - name: Upload client coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/web
            .coverage-provenance/client.json
            config/client-source-manifest.json
            config/client-risk-manifest.json
          if-no-files-found: warn
          retention-days: 30

  concurrency:
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    name: PostgreSQL concurrency lane
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # D-73 makes 8.5 the canonical runtime; the race evidence is recorded
          # on the version that is actually deployed.
          php-version: '8.5'
          tools: composer:v2
          # pcntl forks the parallel writers; without it the race test cannot
          # run at all, and a silently skipped race test is not evidence.
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Cache Composer downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # This lane runs the whole suite, so it renders Blade and needs the Vite
      # manifest. public/build is no longer tracked, so it has to be built here
      # exactly as the PHP quality gate builds it.
      - name: Build production assets
        run: npm run build

      - name: Run the suite and the concurrency evidence against PostgreSQL
        run: composer test:php:pgsql

      - name: Record PostgreSQL evidence identity
        if: always()
        env:
          PGHOST: 127.0.0.1
          PGUSER: rozine_test
          PGPASSWORD: rozine_test
          PGDATABASE: rozine_test
        run: |
          mkdir -p coverage/pgsql
          git rev-parse HEAD > coverage/pgsql/tested-sha.txt
          php --version | head -n 1 > coverage/pgsql/runtime.txt
          psql -X -tAc 'select version();' \
            > coverage/pgsql/database.txt

      - name: Upload PostgreSQL concurrency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgsql-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/pgsql
          if-no-files-found: warn
          retention-days: 30

  negative-control-groups:
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    name: PHP negative controls (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [architecture, business, auditor, coverage]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          # Only the isolated coverage probes need instrumentation.
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: ${{ matrix.group == 'coverage' && 'xdebug' || 'none' }}

      - name: Cache Composer downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Prove the sharded coverage gate fails closed
        if: ${{ matrix.group == 'coverage' }}
        run: php vendor/bin/pest --ci --no-tia tests/Unit/PhpShardGateTest.php --compact

      - name: Prove this group rejects the violations it exists to catch
        env:
          CONTROL_GROUP: ${{ matrix.group }}
        run: bash scripts/quality/verify-negative-controls.sh --group "$CONTROL_GROUP"

      - name: Confirm no planted violation survived the run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the negative-control run left the tree dirty"
            git status --porcelain
            exit 1
          fi

  negative-controls:
    name: PHP gate negative controls
    needs: [plan, negative-control-groups]
    if: ${{ always() && needs.plan.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require every isolated control group to succeed
        env:
          GROUP_RESULT: ${{ needs.negative-control-groups.result }}
        run: bash scripts/quality/require-php-controls.sh "$GROUP_RESULT"

  admission:
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    name: Deployment admission negative controls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prove the D-68 gate refuses every unevidenced candidate
        run: bash .github/scripts/test-deployment-admission.sh

  tested-tree:
    name: Record tested PR tree
    needs: [ci, web, concurrency, negative-controls, admission, board-sync]
    if: ${{ github.event_name == 'pull_request' && needs.ci.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record immutable evidence after every full gate succeeds
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p ci-evidence
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg pull_number "$PR_NUMBER" \
            --arg head_sha "$PR_HEAD" --arg tested_sha "$(git rev-parse HEAD)" \
            --arg tree_sha "$(git rev-parse 'HEAD^{tree}')" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 1, repository: $repository, pull_number: $pull_number,
              head_sha: $head_sha, tested_sha: $tested_sha, tree_sha: $tree_sha,
              run_id: $run_id, run_attempt: $run_attempt}' > ci-evidence/tested-tree.json
      - name: Save the successful PR tree for dev integration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-pr-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/tested-tree.json
          if-no-files-found: error
          retention-days: 30

  dev-smoke:
    name: Dev post-merge smoke
    needs: plan
    if: ${{ needs.plan.outputs.reused == 'true' && needs.plan.outputs.scope == 'full' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Provision isolated PostgreSQL databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Cache Composer downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        env:
          DB_PASSWORD: rozine
        run: php artisan migrate --force

      - name: Build production assets
        run: npm run build

      - name: Check application boot, authentication and role homes
        run: php artisan test --compact --no-tia tests/Feature/ExampleTest.php tests/Feature/DashboardTest.php tests/Feature/RoleHomeAndBookmarkTest.php

      - name: Confirm generated client routes match the server
        run: npm run generated:check

      - name: Record reused full-suite evidence
        env:
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
        run: echo "Full checks passed for this exact file tree in PR run $SOURCE_RUN. Post-merge build and smoke checks passed." >> "$GITHUB_STEP_SUMMARY"

  poc-php:
    needs: plan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    name: POC PHP safety and static checks
    if: ${{ needs.plan.outputs.poc == 'true' }}
    timeout-minutes: 9
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Provision isolated PostgreSQL databases
      env:
        PGHOST: 127.0.0.1
        PGUSER: postgres
        PGPASSWORD: postgres
        PGDATABASE: postgres
      run: psql -X -v ON_ERROR_STOP=1 -f .github/scripts/prepare-test-databases.sql
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.5'
        tools: composer:v2
        extensions: pdo_pgsql, pgsql, pcntl, posix
        coverage: none
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        cache: npm
    - name: Pin npm
      run: 'npm install --global npm@10.9.8

        test "$(npm --version)" = "10.9.8"

        '
    - name: Install Node dependencies from lock file
      run: npm ci
    - name: Cache Composer downloads
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ~/.cache/composer/files
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
    - name: Install PHP dependencies from lock file
      run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
    - name: Copy environment file
      run: cp .env.example .env
    - name: Generate application key
      run: php artisan key:generate
    - name: Run database migrations
      env:
        DB_PASSWORD: rozine
      run: php artisan migrate --force
    - name: Build production assets
      run: npm run build
    - name: Run PHP formatting and full Pest-aware static analysis
      run: composer ci:check:php:static
    - name: Run explicit POC PostgreSQL safety catalog without coverage replay
      run: python3 .github/scripts/run-poc-tests.py php
    - name: Prove deployment admission refuses missing scoped evidence
      run: bash .github/scripts/test-deployment-admission.sh
    - name: Prove scoped selection and evidence reuse fail closed
      run: python3 -B -m unittest discover -s .github/scripts -p 'test_validation_scope.py' -v
    - name: Upload explicitly partial POC test evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: poc-php-${{ github.run_id }}-${{ github.run_attempt }}
        path: coverage/poc
        if-no-files-found: error
        retention-days: 30
    - name: Record POC validation tree
      run: python3 .github/scripts/select-validation-scope.py record poc
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - name: Publish POC validation tree
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: validation-tree-${{ github.run_id }}-${{ github.run_attempt }}
        path: ci-evidence/tested-tree.json
        if-no-files-found: error
        retention-days: 30
    - name: Require combined POC execution within ten minutes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/check-poc-budget.py
    permissions:
      contents: read
      actions: read

  poc-web:
    needs: plan
    runs-on: ubuntu-latest
    name: POC web safety and static checks
    if: ${{ needs.plan.outputs.poc == 'true' }}
    timeout-minutes: 9
    steps:
    - name: Checkout exact tested commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Setup PHP for Wayfinder generation
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.5'
        tools: composer:v2
        coverage: none
    - name: Cache Composer downloads
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ~/.cache/composer/files
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
    - name: Install PHP dependencies for Wayfinder generation
      run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
    - name: Prepare Laravel for Wayfinder generation
      run: 'cp .env.example .env

        php artisan key:generate

        '
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.15.0
        cache: npm
    - name: Pin npm
      run: 'npm install --global npm@10.9.8

        test "$(npm --version)" = "10.9.8"

        '
    - name: Install Node dependencies from lock file
      run: npm ci
    - name: Reject high-severity dependency advisories
      run: npm audit --audit-level=high
    - name: Run lint, formatting, types, i18n, production build and generated routes
      run: npm run lint:check && npm run format:check && npm run types:check && npm run i18n:check && npm run build && npm run generated:check
    - name: Run explicit POC client safety catalog without coverage claims
      run: python3 .github/scripts/run-poc-tests.py web
    - name: Upload explicitly partial POC test evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: poc-web-${{ github.run_id }}-${{ github.run_attempt }}
        path: coverage/poc
        if-no-files-found: error
        retention-days: 30

  validation-tree:
    name: Record validation tree
    needs:
    - plan
    - ci
    - web
    - concurrency
    - negative-controls
    - admission
    - board-sync
    if: ${{ always() && needs.plan.outputs.full == 'true' && needs.plan.result == 'success' && needs.board-sync.result == 'success' && needs.ci.result
      == 'success' && needs.web.result == 'success' && needs.concurrency.result == 'success' && needs.negative-controls.result == 'success' && needs.admission.result
      == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Checkout exact validation candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Bind executed check set and validation scope to the entire Git tree
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SCOPE: ${{ needs.plan.outputs.scope }}
      run: python3 .github/scripts/select-validation-scope.py record "$SCOPE"
    - name: Upload scope-bound full release evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: validation-tree-${{ github.run_id }}-${{ github.run_attempt }}
        path: ci-evidence/tested-tree.json
        if-no-files-found: error
        retention-days: 30

  reuse-full:
    name: Reuse full validation evidence
    needs: plan
    if: ${{ needs.plan.outputs.reused == 'true' && needs.plan.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
    - name: Checkout exact validation candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Revalidate original full proof for the exact candidate tree
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/select-validation-scope.py verify-full


  reuse-poc:
    name: Reuse POC validation evidence
    needs: plan
    if: ${{ needs.plan.outputs.reused == 'true' && needs.plan.outputs.scope == 'poc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout actual proposed merge or pushed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Revalidate original POC proof without repeating passed tests
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
        run: python3 .github/scripts/select-validation-scope.py verify-poc
      - name: Record original POC source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/select-validation-scope.py record-reuse
      - name: Publish POC reuse receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poc-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/tested-tree.json
          if-no-files-found: error
          retention-days: 30
      - name: Require combined POC execution within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-poc-budget.py
      - name: Distinguish POC staging from full production admission
        run: echo 'Original identical-tree POC proof retained. Staging still needs current-tip and independent-review admission; production needs full exact-candidate validation.' >> "$GITHUB_STEP_SUMMARY"
